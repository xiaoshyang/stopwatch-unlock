; M5Stack StopWatch (ESP32-S3R8) — BLE HID 一键解锁（无线版）
; 完全无线工作：板子不插线也能解锁 Mac。Mac 蓝牙设置里配对一次（设备名 M5StopWatchUnlock）
; BLE 支持来自 arduino-esp32 框架内置 libraries/BLE（NimBLE）+ BLEHIDDevice，无需额外库
[platformio]
src_dir = .

[env:stopwatch_ble]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 5177344
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
    https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
    https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
